<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公歧导航 · 我的网址导航</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F6B5B'/%3E%3Cpath d='M18 32h28M32 18v28' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F3EC;
  --paper-2:#EFEBE0;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --ink:#1C222B;
  --ink-2:#3A4250;
  --muted:#7A8394;
  --line:#E5E0D4;
  --line-2:#EDE8DC;
  --accent:#0F6B5B;
  --accent-strong:#0B5548;
  --accent-soft:#E4F1EC;
  --accent-ink:#0E6E5E;
  --amber:#D98A3C;
  --amber-soft:#FBEFDD;
  --danger:#C0392B;
  --danger-soft:#FBE9E6;
  --radius:16px;
  --radius-sm:11px;
  --shadow-1:0 1px 2px rgba(28,34,43,.04),0 8px 24px -12px rgba(28,34,43,.14);
  --shadow-2:0 2px 6px rgba(28,34,43,.06),0 18px 48px -20px rgba(28,34,43,.22);
  --font-sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --font-serif:"Noto Serif SC","Songti SC",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}

/* 背景装饰 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60rem 40rem at 85% -10%, rgba(15,107,91,.10), transparent 60%),
    radial-gradient(50rem 36rem at -10% 20%, rgba(217,138,60,.10), transparent 55%),
    var(--paper);
}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;
  background:rgba(246,243,236,.82);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;user-select:none}
.brand .mark{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(145deg,var(--accent),#129078);
  color:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 6px 14px -6px rgba(15,107,91,.5);
}
.brand .mark svg{width:22px;height:22px}
.brand .name{
  font-family:var(--font-serif);font-weight:900;font-size:19px;letter-spacing:.5px;
  line-height:1.1;
}
.brand .sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.12em}
.search{
  flex:1;max-width:520px;margin:0 auto;position:relative;
}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{
  width:100%;padding:10px 16px 10px 44px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:14px;color:var(--ink);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,91,.14)}
.search input::placeholder{color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-2);transition:background .15s,color .15s,transform .15s;
}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:11px;font-size:13.5px;font-weight:600;
  transition:background .15s,color .15s,box-shadow .15s,transform .1s;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-strong);box-shadow:0 6px 16px -6px rgba(15,107,91,.55)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn-danger-ghost{background:var(--danger-soft);color:var(--danger)}
.btn-danger-ghost:hover{background:#f5d5d0}
.btn:active{transform:translateY(1px)}
.btn.edit-mode-active{background:var(--amber);color:#fff}
.btn.edit-mode-active:hover{background:#c97a2c}

/* ===== 多引擎快捷搜索栏 ===== */
.websearch{max-width:1280px;margin:20px auto 2px;padding:0 28px;width:100%}
.ws-card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-1);padding:18px 20px 18px;
}
.ws-engines{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ws-engine{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  transition:all .15s;cursor:pointer;
}
.ws-engine img{width:17px;height:17px;border-radius:4px;flex:none}
.ws-engine .letter{width:17px;height:17px;border-radius:5px;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.ws-engine:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.ws-engine.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 14px -6px rgba(15,107,91,.5)}
.ws-row{display:flex;gap:10px}
.ws-row input{
  flex:1;padding:12px 18px;border-radius:14px;border:1px solid var(--line);
  font-size:15px;outline:none;background:var(--surface-2);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
.ws-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,91,.14)}
.ws-row input::placeholder{color:var(--muted)}
.ws-go{
  padding:12px 26px;border-radius:14px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 8px 18px -8px rgba(15,107,91,.55);transition:background .15s,transform .1s;
  white-space:nowrap;
}
.ws-go svg{width:17px;height:17px}
.ws-go:hover{background:var(--accent-strong)}
.ws-go:active{transform:translateY(1px)}

/* ===== 大分类标签 ===== */
.bigtabs-wrap{position:relative}
.bigtabs{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:14px 28px 12px;max-width:1280px;margin:0 auto;
}
.bigtab{
  position:relative;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 10px;border-radius:12px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .18s,color .18s,box-shadow .18s,transform .1s;
}
@media (max-width:900px){ .bigtabs{grid-template-columns:repeat(3,1fr);padding:12px 16px;max-width:1280px;margin:0 auto} }
@media (max-width:480px){ .bigtabs{grid-template-columns:repeat(2,1fr);padding:10px 12px;max-width:1280px;margin:0 auto} }
.bigtab:hover{background:var(--surface);box-shadow:var(--shadow-1);transform:translateY(-1px)}
.bigtab.active{
  background:var(--accent);color:#fff;
  box-shadow:0 8px 20px -8px rgba(15,107,91,.6);
}
.bigtab.active .tabcount{background:rgba(255,255,255,.22)}
.tabcount{
  font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  display:inline-grid;place-items:center;background:var(--line-2);color:var(--muted);
}
.bigtab .tab-x{
  width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:rgba(255,255,255,.9);opacity:0;transition:opacity .15s,background .15s;
  background:rgba(0,0,0,.22);
}
.bigtab .tab-x:hover{background:rgba(255,255,255,.24)}
.bigtab .tab-x-del{color:#ffd4d4}
.bigtab .tab-x-del:hover{background:#c0392b;color:#fff}
.bigtab:hover .tab-x{opacity:1}
body.editing .bigtab .tab-x{opacity:1}
.bigtabs .add-tab{
  width:100%;height:40px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:13px;font-weight:600;
  border:1.5px dashed var(--line);transition:all .15s;
}
.bigtabs .add-tab:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* ===== 主体 ===== */
.main{
  padding:16px 28px 80px;max-width:1280px;margin:0 auto;
}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:6px 0 14px;padding:0 2px;
}
.section-head h2{font-family:var(--font-serif);font-weight:700;font-size:17px;letter-spacing:.3px}
.section-head .hint{font-size:12px;color:var(--muted)}

/* 分组（子分类） */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:26px}
.group-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:14px 16px;transition:transform .18s,box-shadow .18s,border-color .18s;
}
.group-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-1);border-color:var(--line)}
.group-card .gicon{
  width:42px;height:42px;border-radius:12px;flex:none;
  display:grid;place-items:center;color:#fff;
  font-family:var(--font-serif);font-weight:700;font-size:16px;
  box-shadow:inset 0 -10px 16px -12px rgba(0,0,0,.4);
}
.group-card .ginfo{min-width:0;flex:1}
.group-card .gname{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-card .gcount{font-size:11.5px;color:var(--muted);margin-top:2px}
.group-card .g-arrow{color:var(--muted);flex:none;transition:transform .18s}
.group-card:hover .g-arrow{transform:translateX(3px);color:var(--accent)}
.group-card .g-tools{display:flex;gap:4px;margin-left:auto;flex:none;opacity:0;transition:opacity .15s}
.group-card:hover .g-tools{opacity:1}
.g-tools .mini-btn{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  color:var(--muted);transition:background .15s,color .15s;
}
.g-tools .mini-btn svg{width:15px;height:15px}
.g-tools .mini-btn:hover{background:var(--line-2);color:var(--ink)}
.g-tools .mini-btn.del:hover{background:var(--danger-soft);color:var(--danger)}

/* 网址卡片 */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.site-card{
  position:relative;display:flex;flex-direction:column;gap:11px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:18px 16px 16px;transition:transform .18s,box-shadow .18s,border-color .18s;
}
.site-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-1);border-color:var(--line)}
.site-logo{
  width:46px;height:46px;border-radius:13px;overflow:hidden;
  display:grid;place-items:center;background:var(--surface-2);
  border:1px solid var(--line-2);
}
.site-logo img{width:30px;height:30px;object-fit:contain}
.site-logo .fallback{
  width:100%;height:100%;display:grid;place-items:center;
  font-family:var(--font-serif);font-weight:700;font-size:15px;color:#fff;letter-spacing:.5px;
}
.site-name{font-weight:600;font-size:14.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.site-domain{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.site-tools{position:absolute;top:8px;right:8px;display:flex;gap:5px;opacity:0;transition:opacity .15s;z-index:5}
.site-card:hover .site-tools{opacity:1}
body.editing .site-card .site-tools{opacity:1}
.site-tools .mini-btn{
  display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:8px;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);border:1.5px solid var(--line);
  color:var(--ink-2);font-size:12px;font-weight:600;
  transition:background .15s,color .15s,border-color .15s;
}
.site-tools .mini-btn svg{width:13px;height:13px}
.site-tools .mini-btn:hover{background:var(--line-2);color:var(--ink)}
.site-tools .mini-btn.del{color:var(--danger);border-color:var(--danger)}
.site-tools .mini-btn.del:hover{background:var(--danger);color:#fff}
.site-card .fav-star{position:absolute;top:12px;right:12px}
.site-path{font-size:11px;color:var(--accent-ink,var(--muted));opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:1px}
.site-name mark,.site-domain mark{background:rgba(210,168,80,.35);color:inherit;border-radius:2px;padding:0 1px}
.search-tip{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}

/* 拖拽 */
.site-card.drag,.sub-head[draggable]{cursor:grab}
.site-card.dragging-src,.sub-head.dragging-src,.bigtab.dragging-src{opacity:.35}
.sites.drop-in,.sub-block.drop-in{outline:2px dashed var(--accent-ink,var(--accent));outline-offset:3px;border-radius:10px;background:var(--accent-soft)}
.site-card.drop-before{box-shadow:-3px 0 0 var(--accent)}
.site-card.drop-after{box-shadow:3px 0 0 var(--accent)}
.sub-block.drop-before{box-shadow:0 -3px 0 var(--accent)}
.sub-block.drop-after{box-shadow:0 3px 0 var(--accent)}
.bigtab.drop-before{box-shadow:-3px 0 0 var(--accent)}
.bigtab.drop-after{box-shadow:3px 0 0 var(--accent)}
#bigtabs.drop-in{outline:2px dashed var(--accent-ink,var(--accent));outline-offset:4px;border-radius:12px}
@media (max-width:640px){.search-tip{display:none}}

/* 空状态 */
.empty{
  text-align:center;padding:48px 20px;color:var(--muted);
  border:1.5px dashed var(--line);border-radius:var(--radius);
  background:rgba(255,255,255,.4);
}
.empty svg{width:40px;height:40px;margin-bottom:12px;color:var(--line)}
.empty .t{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.empty .d{font-size:13px;margin-bottom:16px}
.empty .btn{display:inline-flex}
.inline-note{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:14px 16px;margin:2px 0 8px;font-size:13px;color:var(--muted);
  background:rgba(255,255,255,.5);border:1px dashed var(--line);border-radius:12px;
}
.inline-note svg{width:17px;height:17px;flex:none;color:var(--accent)}

/* ===== 弹窗 ===== */
.modal-mask{
  position:fixed;inset:0;z-index:100;background:rgba(20,26,32,.44);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%);max-height:92vh;overflow-y:auto;
  background:var(--surface);border-radius:20px;box-shadow:var(--shadow-2);
  animation:pop .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 22px 14px;
}
.modal-head h3{font-family:var(--font-serif);font-weight:700;font-size:17px}
.modal-head .x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.modal-head .x:hover{background:var(--line-2);color:var(--ink)}
.modal-body{padding:4px 22px 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.field .lbl-hint{font-weight:400;color:var(--muted)}
.input{
  width:100%;padding:10px 14px;border-radius:11px;border:1px solid var(--line);
  font-size:14px;background:var(--surface);color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,91,.12)}
.input::placeholder{color:var(--muted)}

/* logo 选择 */
.logo-opt-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.logo-opt{
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);transition:all .15s;
}
.logo-opt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.logo-opt:hover:not(.active){border-color:var(--accent);color:var(--accent-ink)}
.logo-preview-row{display:flex;align-items:center;gap:14px;margin-top:4px}
.logo-preview{
  width:54px;height:54px;border-radius:14px;overflow:hidden;flex:none;
  border:1px solid var(--line-2);background:var(--surface-2);display:grid;place-items:center;
}
.logo-preview img{width:34px;height:34px;object-fit:contain}
.logo-preview .fallback{width:100%;height:100%;display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:24px;color:#fff}
.logo-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin-top:4px}
.logo-lib button{
  aspect-ratio:1;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface-2);display:grid;place-items:center;position:relative;
  transition:all .15s;
}
.logo-lib button img{width:26px;height:26px;object-fit:contain}
.logo-lib button:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 10px -4px rgba(15,107,91,.3)}
.logo-lib button.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,91,.2)}
.logo-lib .lib-fallback{font-size:13px;font-family:var(--font-serif);font-weight:700;color:#fff;width:100%;height:100%;display:grid;place-items:center}
.modal-foot{
  display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px;
}

/* 确认框 */
.confirm-modal{width:min(400px,100%)}
.confirm-body{padding:6px 22px 20px}
.confirm-body .msg{font-size:14px;color:var(--ink-2);line-height:1.6}
.confirm-body .msg strong{color:var(--danger)}

/* toast */
.toast-root{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;
  font-size:13.5px;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:9px;
  animation:toastIn .25s cubic-bezier(.2,.8,.3,1);max-width:88vw;
}
.toast.success{background:var(--accent)}
.toast.error{background:var(--danger)}
.toast svg{width:16px;height:16px;flex:none}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

/* 搜索结果 */
.search-scope{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.search-scope .btn{font-size:12px;padding:5px 11px}

/* 响应式 */
body.editing .site-tools, body.editing .g-tools{opacity:1}
@media (max-width:720px){
  .search input, .input{font-size:16px}
  .websearch{padding:0 16px}
  .ws-row{flex-direction:column}
  .ws-go{justify-content:center}
  .topbar{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .brand .sub{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  .bigtabs{padding:12px 16px}
  .main{padding:14px 16px 70px}
  .brand .name{font-size:17px}
  .top-actions{gap:4px}
  .btn .lbl{display:none}
  .groups{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sites{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}

.sync-status.err{color:#dc2626;border-color:#dc262655;background:#dc262612}

.big-head{display:flex;align-items:center;gap:14px;padding:4px 2px 18px}

.big-title{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:.5px}
.big-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.big-head .btn{margin-left:auto}
.sub-block{margin-bottom:26px}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function $(s,root){return (root||document).querySelector(s);}
function $$(s,root){return Array.prototype.slice.call((root||document).querySelectorAll(s));}
function faviconFor(domain,sz){
  domain = domain || '';
  return 'https://favicon.im/' + encodeURIComponent(domain) + '?larger=true';
}
/* 多源 favicon 候选：依次尝试，全部失败则回退字母占位（favErr 处理） */
function favCandidates(domain){
  var d = domain || '';
  return [
    'https://favicon.im/' + encodeURIComponent(d) + '?larger=true',
    'https://icons.duckduckgo.com/ip3/' + d + '.ico',
    'https://' + d + '/favicon.ico',
    'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(d) + '&sz=64'
  ];
}
function favErr(img){
  var dom = img.getAttribute('data-fc');
  if(dom){
    var cands = favCandidates(dom);
    var cur = parseInt(img.getAttribute('data-fi')||'0',10);
    if(cur < cands.length-1){ cur++; img.setAttribute('data-fi', cur); img.src = cands[cur]; return; }
  }
  var wrap = img.closest('.site-logo') || img.closest('.logo-lib button') || img.closest('.logo-preview') || img.closest('.ws-engine');
  var name = img.getAttribute('data-name') || (wrap?wrap.getAttribute('data-name'):'') || dom || '网';
  var url = img.getAttribute('data-url') || (wrap?wrap.getAttribute('data-url'):'') || '';
  var color = colorFor({id:url||dom,name:name})[0];
  var isChip = wrap && wrap.classList.contains('ws-engine');
  var label = logoText(name);
  var f = document.createElement('span');
  f.className = isChip ? 'letter' : 'fallback';
  f.textContent = label;
  f.style.background = 'linear-gradient(145deg,' + color + ',#00000022)';
  img.replaceWith(f);
}
/* 生成占位 Logo 文字：中文取前 2 字，英文取前 2 字母大写 */
function logoText(name){
  var n = (name||'').replace(/^\[?\(?/,'').trim();
  if(!n) return '?';
  if(/[\u4e00-\u9fa5]/.test(n)){ return n.slice(0,2); }
  var ascii = n.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  if(ascii.length>=2) return ascii.slice(0,2);
  return n.charAt(0).toUpperCase();
}
function domainOf(url){
  try{ var u = new URL(url); return u.hostname; }catch(e){ 
    var m = String(url||'').match(/^(?:https?:\/\/)?([^\/:\s]+)/); return m?m[1]:''; }
}

/* ====== 状态 ====== */
var state = { bigCategories: [], activeBigId: null, path: [], editMode: false, searching: false, collapsed: {}, pendingSubCatId: null };
var savedSearch = '';

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var d = JSON.parse(raw); if(d && d.bigCategories && d.bigCategories.length){ state.bigCategories = d.bigCategories; return; } }
  }catch(e){}
  state.bigCategories = seedData();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({bigCategories:state.bigCategories})); }
  catch(e){ toast('保存失败：本地存储不可用', 'error'); }
  syncPushDebounce();
}
function activeBig(){
  return state.bigCategories.find(function(b){ return b.id === state.activeBigId; }) || state.bigCategories[0] || null;
}
/* path 为从大分类下第一级子分类起的 id 数组；返回当前所处节点（大分类或子分类） */
function nodeAt(big){
  var cur = big; var p = state.path;
  for(var i=0;i<p.length;i++){
    if(!cur || !cur.children) return null;
    var hit = cur.children.find(function(c){ return c.id === p[i]; });
    if(!hit) return null;
    cur = hit;
  }
  return cur;
}
function countSites(node){
  var n = 0;
  if(!node) return 0;
  (node.sites||[]).forEach(function(){n++;});
  (node.children||[]).forEach(function(c){ n += countSites(c); });
  return n;
}
function colorFor(node){
  var h = 0; var s = String(node.id||node.name||''); for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) % 997; }
  return PALETTE[h % PALETTE.length];
}

/* ====== 渲染 ====== */
function renderAll(){ renderTabs(); renderMain(); applyTheme(); }

function renderTabs(){
  var el = $('#bigtabs'); var h = '';
  state.bigCategories.forEach(function(b){
    var c = colorFor(b)[1];
    h += '<button class="bigtab' + (b.id===state.activeBigId?' active':'') + '" data-id="' + b.id + '" data-act="tab" ' + (state.editMode?'draggable="true" data-k="big"':'') + '>';
    if(b.icon) h += '<span style="color:inherit">' + esc(b.icon) + '</span>';
    h += esc(b.name);
    h += '<span class="tabcount">' + countSites(b) + '</span>';
    if(state.editMode) h += '<span class="tab-x" data-act="renameBig" data-id="' + b.id + '" title="重命名大分类"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>';
    h += '<span class="tab-x tab-x-del" data-act="tabx" data-id="' + b.id + '" title="删除大分类"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>';
    h += '</button>';
  });
  h += '<button class="add-tab" data-act="addbig" title="新建大分类"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
  el.innerHTML = h;
}
function renderMain(){
  var main = $('#main');
  if(savedSearch){ renderSearch(); return; }
  var big = activeBig(); if(!big){ main.innerHTML = ''; return; }
  var pal = colorFor(big);
  var h = '';
  /* 大分类信息条 */
  h += '<div class="big-head">';
  h += '<span class="big-mark" style="background:linear-gradient(145deg,' + pal[0] + ',' + pal[1] + ')">' + esc(big.icon||'') + '</span>';
  h += '<div><div class="big-title">' + esc(big.name) + '</div>';
  h += '<div class="big-sub">' + countSites(big) + ' 个网址 · ' + (big.children||[]).length + ' 个分类</div></div>';
  if(state.editMode) h += '<button class="btn btn-ghost" data-act="addsub"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建分类</button>';
  if(state.editMode) h += '<button class="btn btn-ghost" data-act="dedupe" title="删除全站 URL 完全相同的重复网址"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>清理重复</button>';
  h += '</div>';
  /* 子分类区块（笔点式平铺） */
  (big.children||[]).forEach(function(c){ h += renderBlock(big, c, 0); });
  if(state.editMode){
    h += '<div class="big-foot-actions"><button class="btn btn-ghost" data-act="addsub"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新建分类</button>';
    h += '<button class="btn btn-ghost" data-act="dedupe" title="删除全站 URL 完全相同的重复网址"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>清理重复</button></div>';
  }
  main.innerHTML = h;
}
function renderBlock(big, c, depth){
  var collapsed = !!state.collapsed[c.id];
  var cp = colorFor(c);
  var n = countSites(c);
  var nested = c.children && c.children.length;
  var h = '';
  h += '<section class="sub-block" style="margin-left:' + (depth*16) + 'px" data-sid="' + c.id + '" data-big="' + big.id + '" data-depth="' + depth + '">';
  var subDragAttr = state.editMode ? ' draggable="true" data-k="sub" data-big="' + big.id + '" title="拖拽可移动/排序"' : '';
  h += '<div class="sub-head' + (collapsed?' collapsed':'') + '" data-act="togsub" data-id="' + c.id + '"' + subDragAttr + '>';
  h += '<span class="sub-chev' + (collapsed?' down':'') + '"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>';
  h += '<span class="sub-ic" style="background:linear-gradient(145deg,' + cp[0] + ',' + cp[1] + ')">' + esc((c.icon||c.name.charAt(0))) + '</span>';
  h += '<span class="sub-name">' + esc(c.name) + '</span>';
  h += '<span class="sub-count">' + n + '</span>';
  if(state.editMode){
    h += '<span class="sub-tools">';
    h += '<button class="mini-btn add" data-act="addsite" data-sid="' + c.id + '" title="添加网址"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>添加</span></button>';
    h += '<button class="mini-btn" data-act="renamesub" data-id="' + c.id + '" title="重命名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>重命名</span></button>';
    h += '<button class="mini-btn del" data-act="delsub" data-id="' + c.id + '" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>删除</span></button>';
    h += '</span>';
  }
  h += '</div>';
  if(!collapsed){
    if(nested){
      h += '<div class="sub-nested">';
      c.children.forEach(function(cc){ h += renderBlock(big, cc, depth+1); });
      h += '</div>';
    }
    var sites = c.sites || [];
    if(sites.length){
      h += '<div class="sites" data-drop="sites" data-sid="' + c.id + '">';
      sites.forEach(function(s){ h += renderSiteCard(big, c, s); });
      h += '</div>';
    } else if(!nested && !state.editMode){
      h += '<div class="inline-note">该分类暂无网址</div>';
    }
  }
  h += '</section>';
  return h;
}
function renderSiteCard(big, sub, s){
  var dom = domainOf(s.url);
  var h = '';
  var cardDragAttr = state.editMode ? ' draggable="true" data-k="site" data-id="' + s.id + '" data-sid="' + sub.id + '" data-big="' + big.id + '" title="拖拽可移动/排序"' : '';
  h += '<a class="site-card' + (state.editMode?' drag':'') + '" href="' + esc(s.url) + '" target="_blank" rel="noopener" data-url="' + esc(s.url) + '"' + cardDragAttr + '>';
  h += '<div class="site-logo" data-logo="' + esc(s.logo||'') + '" data-url="' + esc(s.url) + '" data-name="' + esc(s.name) + '">';
  if(s.logo && s.logo !== 'auto') h += '<img src="' + esc(s.logo) + '" alt="" onerror="favErr(this)">';
  else h += '<img src="' + favCandidates(dom)[0] + '" alt="" data-fc="' + esc(dom) + '" data-fi="0" data-url="' + esc(s.url) + '" data-name="' + esc(s.name) + '" onerror="favErr(this)">';
  h += '</div>';
  h += '<div class="site-name">' + esc(s.name) + '</div>';
  h += '<div class="site-domain">' + esc(dom) + '</div>';
  if(state.editMode){
    h += '<div class="site-tools">';
    h += '<button class="mini-btn" data-act="editsite" data-sid="' + sub.id + '" data-id="' + s.id + '" title="编辑网址"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>编辑</span></button>';
    h += '<button class="mini-btn del" data-act="delsite" data-sid="' + sub.id + '" data-id="' + s.id + '" title="删除网址"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>删除</span></button>';
    h += '</div>';
  }
  h += '</a>';
  return h;
}
function fallbackLogo(img){
  var wrap = img.closest('.site-logo');
  if(wrap){
    var name = wrap.getAttribute('data-name') || '?';
    var url = wrap.getAttribute('data-url') || '';
    var color = colorFor({id:url,name:name})[0];
    var f = document.createElement('div');
    f.className = 'fallback'; f.textContent = logoText(name);
    f.style.background = 'linear-gradient(145deg,' + color + ',#00000022)';
    img.replaceWith(f);
  }
}
</script>
<script>
/* ====== 弹窗系统 ====== */
function openModal(html){
  var root = $('#modalRoot');
  root.innerHTML = '<div class="modal">' + html + '</div>';
  root.style.display = 'flex';
  root.querySelector('.modal').addEventListener('click', function(e){
    /* 点击弹窗空白处（modal 本体）才关闭；点击内部按钮正常冒泡给 actionHandler */
    if(e.target === this){ closeModal(); }
  });
  /* 点击遮罩空白（modalRoot 本体）才关闭；内部按钮冒泡不触发关闭 */
  root.onclick = function(e){ if(e.target === this){ closeModal(); } };
}
function closeModal(){ $('#modalRoot').style.display='none'; $('#modalRoot').innerHTML=''; }

function toast(msg, type){
  var root = $('#toastRoot');
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  var icon = type==='error'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>'
    : type==='success'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/></svg>';
  el.innerHTML = icon + '<span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(function(){ el.remove(); },300); }, 2200);
}

/* ====== 分类：新建 / 重命名 ====== */
/* kind: 'big' 大分类 ; 'sub' 子分类 ; target 为要重命名的节点(可选) ; parentSub 为子分类的父节点 */
function openCatModal(kind, target, parentSub){
  var isEdit = !!target;
  openModal(
    '<div class="modal-head"><h3>' + (kind==='big' ? (isEdit?'重命名大分类':'新建大分类') : (isEdit?'重命名分类':'新建子分类')) + '</h3>' +
    '<button class="x" data-act="close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>分类名称</label><input class="input" id="catName" maxlength="20" placeholder="如：设计灵感" value="' + esc(target?target.name:'') + '"></div>' +
      '<div class="field"><label>图标（可选，单字或符号）</label><input class="input" id="catIcon" maxlength="2" placeholder="如：★ 或 设" value="' + esc(target?(target.icon||''):'') + '"></div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-act="close">取消</button>' +
      '<button class="btn btn-primary" data-act="saveCat" data-kind="' + kind + '" data-edit="' + (isEdit?'1':'0') + '" data-id="' + (target?target.id:'') + '" data-pid="' + (parentSub?parentSub.id:'') + '">保存</button>' +
    '</div>'
  );
  var inp = $('#catName'); if(inp) inp.focus();
}
function saveCatAction(btn){
  var name = $('#catName').value.trim();
  var icon = $('#catIcon').value.trim();
  if(!name){ toast('请输入分类名称','error'); return; }
  var kind = btn.getAttribute('data-kind');
  var isEdit = btn.getAttribute('data-edit') === '1';
  var id = btn.getAttribute('data-id');
  var pid = btn.getAttribute('data-pid');
  if(kind==='big'){
    if(isEdit){
      var b = state.bigCategories.find(function(x){return x.id===id;});
      if(b){ b.name = name; b.icon = icon; toast('已重命名','success'); }
    } else {
      var nb = {id:uid(), name:name, icon:icon||name.charAt(0), children:[]};
      state.bigCategories.push(nb);
      state.activeBigId = nb.id; state.path = [];
      toast('已新建大分类','success');
    }
  } else {
    var big = activeBig(); var cur = nodeAt(big);
    if(isEdit){
      var node = findNodeIn(big, id);
      if(node){ node.name = name; node.icon = icon; toast('已重命名','success'); }
    } else {
      if(!cur.children) cur.children = [];
      cur.children.push({id:uid(), name:name, icon:icon||name.charAt(0), children:[]});
      toast('已新建子分类','success');
    }
  }
  save(); closeModal(); renderAll();
}
function findNodeIn(big, id){
  var stack = [big]; 
  while(stack.length){
    var n = stack.pop();
    if(n.id === id) return n;
    (n.children||[]).forEach(function(c){stack.push(c);});
  }
  return null;
}
function deleteNode(big, id, label){
  function rec(children){
    for(var i=0;i<children.length;i++){
      if(children[i].id===id){ children.splice(i,1); return true; }
      if(children[i].children && rec(children[i].children)) return true;
    }
    return false;
  }
  if(rec(big.children)) return true;
  return false;
}

/* ====== 删除确认 ====== */
function confirmDel(msg, onOk){
  openModal(
    '<div class="modal-head"><h3>删除确认</h3><button class="x" data-act="close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="confirm-body"><div class="msg">' + msg + '</div></div>' +
    '<div class="modal-foot"><button class="btn btn-ghost" data-act="close">取消</button><button class="btn btn-danger-ghost" data-act="confirmOk">删除</button></div>'
  );
  $('#modalRoot').setAttribute('data-onok', onOk ? '1':'0');
  window._delOnOk = onOk;
}

/* ====== 网址：新建 / 编辑 ====== */
var siteDraft = { logo:'auto', customLogo:'' };
function openSiteModal(site){
  var isEdit = !!site;
  siteDraft = { logo: site? (site.logo||'auto') : 'auto', customLogo: (site && site.logo && site.logo!=='auto' && !/^https?:\/\//.test(site.logo)) ? '' : (site&&site.logo&&site.logo!=='auto'?site.logo:'') };
  renderSiteModal(isEdit, site);
}
function renderSiteModal(isEdit, site){
  var name = site? site.name : $('#sName')? $('#sName').value : '';
  var url = site? site.url : $('#sUrl')? $('#sUrl').value : '';
  var desc = site? (site.desc||'') : ($('#sDesc')? $('#sDesc').value:'');
  openModal(
    '<div class="modal-head"><h3>' + (isEdit?'编辑网址':'添加网址') + '</h3>' +
    '<button class="x" data-act="close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>网站名称</label><input class="input" id="sName" maxlength="30" placeholder="如：百度" value="' + esc(name) + '"></div>' +
      '<div class="field"><label>网址 URL</label><input class="input" id="sUrl" placeholder="https://…" value="' + esc(url) + '"></div>' +
      '<div class="field"><label>简介（可选）</label><input class="input" id="sDesc" maxlength="60" placeholder="一句话描述" value="' + esc(desc) + '"></div>' +
      '<div class="field">' +
        '<label>网站 Logo <span class="lbl-hint">· 输入网址后自动抓取，也可从下方选择</span></label>' +
        '<div class="logo-opt-tabs">' +
          '<button class="logo-opt" data-act="logoOpt" data-opt="auto">自动抓取</button>' +
          '<button class="logo-opt" data-act="logoOpt" data-opt="lib">Logo 库</button>' +
          '<button class="logo-opt" data-act="logoOpt" data-opt="custom">自定义链接</button>' +
        '</div>' +
        '<div id="logoArea"></div>' +
        '<div class="logo-preview-row">' +
          '<div class="logo-preview" id="logoPreview"></div>' +
          '<div style="font-size:12.5px;color:var(--muted)" id="logoStatus">输入网址后自动抓取网站 Logo</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-ghost" data-act="close">取消</button>' +
      '<button class="btn btn-primary" data-act="saveSite" data-id="' + (site?site.id:'') + '">保存</button>' +

/* ====== 删除完全重复网址 ====== */
/* 规范化 URL：去掉协议、www、尾斜杠、末尾片段，统一小写，用于判断“完全相同” */
function normUrl(u){
  var s = (u||'').trim().toLowerCase();
  s = s.replace(/^https?:\/\//,'').replace(/^www\./,'');
  s = s.replace(/\/#.*$/,'').replace(/\/+$/,'');
  s = s.replace(/\/\?.*$/,'');
  return s;
}
/* 遍历全部大分类，删除 URL 完全相同的重复网址（保留第一条）；返回删除总数 */
function dedupeSites(){
  var removed = 0, total = 0;
  var seen = {};  /* 规范化 URL → 已保留的站点 key（大分类id:子分类id:siteId） */
  state.bigCategories.forEach(function(big){
    (function walk(node){
      var arr = node.sites || [];
      var keep = [];
      for(var i=0;i<arr.length;i++){
        var s = arr[i]; total++;
        var key = normUrl(s.url);
        if(!key){ keep.push(s); continue; }
        if(seen[key]){ removed++; continue; }   /* 已见过相同 URL，丢弃 */
        seen[key] = true; keep.push(s);
      }
      node.sites = keep;
      (node.children||[]).forEach(walk);
    })(big);
  });
  if(total===0){ toast('没有可清理的网址','error'); return 0; }
  if(removed===0){ toast('未发现完全重复的网址','success'); return 0; }
  save(); renderAll();
  toast('已清理 ' + removed + ' 个重复网址（共检查 ' + total + ' 条）','success');
  return removed;
}

var dragItem = null;                 /* {kind:'site'|'sub'|'big', id, sid, big} */
var dragOverEl = null;

function setDrag(d){ dragItem = d; }
function clearDragIndicator(){

/* 大分类 id → 对象 */
function bigById(id){ return state.bigCategories.find(function(b){return b.id===id;}) || null; }

/* 在 children 中查找包含某 id 的节点及其父 */
function findContainer(big, id){
  function rec(node, parent){
    if(!node) return null;
    if(node.children){
      for(var i=0;i<node.children.length;i++){
        if(node.children[i].id===id) return {parent:node, idx:i};
        var r = rec(node.children[i], node);
        if(r) return r;
      }
    }
    return null;
  }
  var r = rec(big, null);
  if(r) return r;
  if(big.id===id) return {parent:null, idx:0};
  return null;
}
/* 网站：在任意子分类 sites 中找（按 id 全树搜索） */
function findSiteByAnyId(big, siteId){
  var found = null;
  (function walk(node){
    if(found) return;
    if(node.sites){
      var idx = node.sites.findIndex(function(s){return s.id===siteId;});
      if(idx>=0){ found = {sub:node, idx:idx, site:node.sites[idx]}; return; }
    }
    (node.children||[]).forEach(walk);
  })(big);
  return found;
}

/* drop 落点判定：坐标落在目标卡片/区块的上/下/中 */
function dropPosition(e, el, vertical){
  var r = el.getBoundingClientRect();
  if(vertical){ return (e.clientY - r.top) < (r.height/2) ? 'before':'after'; }
  return (e.clientX - r.left) < (r.width/2) ? 'before':'after';
}

/* 拖拽网站到某子分类的某个插入点 */
function moveSiteTo(dragId, dragSid, dragBig, targetSubId, insertBeforeSiteId){
  var big = bigById(dragBig); if(!big) return;
  var src = findSiteByAnyId(big, dragId); if(!src) return;
  var site = src.site;
  /* 从原位置移除 */
  src.sub.sites.splice(src.idx, 1);
  /* 目标子分类 */
  var tsub = findNodeIn(big, targetSubId);
  if(!tsub) return;
  if(!tsub.sites) tsub.sites = [];
  if(insertBeforeSiteId){
    var ti = tsub.sites.findIndex(function(s){return s.id===insertBeforeSiteId;});
    if(ti>=0){ tsub.sites.splice(ti,0,site); }
    else { tsub.sites.push(site); }
  } else {
    tsub.sites.push(site);
  }
  save(); renderAll();
}
/* 拖拽子分类到某大分类下某子分类的插入点 */
function moveSubTo(dragSubId, dragBigId, targetBigId, targetParentSubId, insertBeforeSubId){
  var big = bigById(dragBigId); if(!big) return;
  var src = findContainer(big, dragSubId); if(!src || !src.parent) return;
  var node = src.parent.children[src.idx];
  src.parent.children.splice(src.idx,1);
  var tbig = bigById(targetBigId); if(!tbig) return;
  var tparent = tbig;
  if(targetParentSubId){ var p = findNodeIn(tbig, targetParentSubId); if(p) tparent = p; }
  if(!tparent.children) tparent.children = [];
  if(insertBeforeSubId){
    var ti = tparent.children.findIndex(function(c){return c.id===insertBeforeSubId;});
    if(ti>=0){ tparent.children.splice(ti,0,node); }
    else { tparent.children.push(node); }
  } else {
    tparent.children.push(node);
  }
  save(); renderAll();
}
/* 拖拽大分类排序 */
function moveBigTo(dragBigId, insertBeforeBigId){
  var idx = state.bigCategories.findIndex(function(b){return b.id===dragBigId;});
  if(idx<0) return;
  var node = state.bigCategories[idx];
  state.bigCategories.splice(idx,1);
  var ti = state.bigCategories.findIndex(function(b){return b.id===insertBeforeBigId;});
  if(ti>=0){ state.bigCategories.splice(ti,0,node); }
  else { state.bigCategories.push(node); }
  save(); renderAll();
}

      t.classList.add('selected');

    }

      closeModal(); if(onOk){ onOk(); }
      return;
    }

  /* 顶栏 & 标签 & 主体 */
  switch(act){
    case 'addbig':
      if(!state.editMode) setEditing(true);
      openCatModal('big', null, null);
      return;
    case 'tab':
      if(t.getAttribute('data-id')){
        state.activeBigId = t.getAttribute('data-id'); state.path=[];
        savedSearch=''; $('#searchInput').value='';
        renderAll();
      }
      return;

      if(state.editMode){

        confirmDel('确定删除大分类「<strong>' + esc((state.bigCategories.find(function(b){return b.id===bid;})||{}).name || '') + '</strong>」？其下所有网址将一并删除。', function(){
          var idx = state.bigCategories.findIndex(function(b){return b.id===bid;});

            if(state.activeBigId===bid){ state.activeBigId = state.bigCategories.length? state.bigCategories[0].id : null; state.path=[]; }
            save(); renderAll(); toast('已删除大分类','success');
          }
        });
      }
      return;
    case 'renameBig':
      if(state.editMode){
        var rbid = t.getAttribute('data-id');
        var rbig = state.bigCategories.find(function(b){return b.id===rbid;});
        if(rbig){ openCatModal('big', rbig, null); }
      }

    case 'togsub':
      var cid = t.getAttribute('data-id');
      if(state.collapsed[cid]){ delete state.collapsed[cid]; } else { state.collapsed[cid] = true; }
      renderAll(); return;
    case 'addsub':
      state.pendingSubCatId = null;
      openCatModal('sub', null, null); return;
    case 'renamesub':
      var n1 = findNodeIn(activeBig(), t.getAttribute('data-id'));
      openCatModal('sub', n1, null); return;
    case 'delsub':
      var dnode = findNodeIn(activeBig(), t.getAttribute('data-id'));
      confirmDel('确定删除分类「<strong>' + esc(dnode.name) + '</strong>」？其下所有网址将一并删除。', function(){
        deleteNode(activeBig(), dnode.id, dnode.name);
        save(); renderAll(); toast('已删除分类','success');
      });
      return;
    case 'addsite':
      state.pendingSubCatId = t.getAttribute('data-sid') || null;
      openSiteModal(null); return;
    case 'editsite':
      var sid = t.getAttribute('data-sid');
      var sub = findNodeIn(activeBig(), sid);
      var s = sub ? (sub.sites||[]).find(function(x){return x.id===t.getAttribute('data-id');}) : null;
      if(s){ state.pendingSubCatId = sid; openSiteModal(s); }
      return;
    case 'delsite':
      var sid2 = t.getAttribute('data-sid');
      var sub2 = findNodeIn(activeBig(), sid2);
      var ss = sub2 ? (sub2.sites||[]).find(function(x){return x.id===t.getAttribute('data-id');}) : null;
      confirmDel('确定删除网址「<strong>' + esc(ss.name) + '</strong>」？', function(){
        sub2.sites = sub2.sites.filter(function(x){return x.id!==ss.id;});
        save(); renderAll(); toast('已删除','success');
      });
      return;
    case 'turned':
      setEditing(true); openSiteModal(null); return;
    case 'clearSearch':
      savedSearch=''; $('#searchInput').value=''; renderAll(); return;
    case 'dedupe':
      if(state.editMode){
        confirmDel('将删除全站「URL 完全相同」的重复网址，每个网址仅保留一条。确定继续？', dedupeSites);
      }
      return;
  }
}

/* ====== 拖拽事件 ====== */
var dragGhost = null;
document.addEventListener('dragstart', function(e){
  var t = e.target.closest('[data-k]');
  if(!t) return;
  var k = t.getAttribute('data-k');
  if(k==='big') setDrag({kind:'big', id:t.getAttribute('data-id')});
  else if(k==='sub') setDrag({kind:'sub', id:t.getAttribute('data-id'), big:t.getAttribute('data-big')});
  else if(k==='site') setDrag({kind:'site', id:t.getAttribute('data-id'), sid:t.getAttribute('data-sid'), big:t.getAttribute('data-big')});
  else return;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', 'x'); }catch(err){}
  e.dataTransfer.setDragImage(t, 40, 20);
  t.classList.add('dragging-src');
});
document.addEventListener('dragend', function(){
  dragItem = null;
  clearDragIndicator();
  $$('.dragging-src').forEach(function(el){ el.classList.remove('dragging-src'); });
});

/* dragover：仅编辑模式且正在拖拽时，给可落点加指示 */
document.addEventListener('dragover', function(e){
  if(!state.editMode || !dragItem) return;
  var t = e.target.closest('.sub-block, .sites, .bigtab[data-k="big"], .site-card[data-k="site"], #bigtabs');
  if(!t){ clearDragIndicator(); return; }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(dragItem.kind==='site'){
    /* 网站可落：.site-card（同子分类排序）或 .sites（移动到该子分类） */
    if(t.classList.contains('site-card') && t.getAttribute('data-k')==='site'){
      var pos = dropPosition(e, t, true);
      showIndicator(t, pos==='before'?'drop-before':'drop-after');
      return;
    }
    if(t.classList.contains('sites')){
      showIndicator(t, 'drop-in'); return;
    }
    if(t.classList.contains('sub-block')){
      showIndicator(t, 'drop-in'); return;
    }
    clearDragIndicator(); return;
  }
  if(dragItem.kind==='sub'){
    if(t.classList.contains('sub-block')){
      /* 不能拖到自己内部 */
      if(t.getAttribute('data-sid')===dragItem.id){ clearDragIndicator(); return; }
      var pos = dropPosition(e, t, true);
      showIndicator(t, pos==='before'?'drop-before':'drop-after');
      return;
    }
    if(t.classList.contains('bigtab') && t.getAttribute('data-k')==='big'){
      var tb = t.getAttribute('data-id');
      if(tb===dragItem.big){ showIndicator(t,'drop-after'); }
      else { showIndicator(t,'drop-in'); }
      return;
    }
    clearDragIndicator(); return;
  }
  if(dragItem.kind==='big'){
    if(t.classList.contains('bigtab') && t.getAttribute('data-k')==='big'){
      var pos = dropPosition(e, t, false);
      showIndicator(t, pos==='before'?'drop-before':'drop-after');
      return;
    }
    if(t.id==='bigtabs'){ showIndicator(t,'drop-in'); return; }
    clearDragIndicator(); return;
  }
});

/* drop */
document.addEventListener('drop', function(e){
  if(!state.editMode || !dragItem) return;
  var t = e.target.closest('.sub-block, .sites, .bigtab[data-k="big"], .site-card[data-k="site"], #bigtabs');
  e.preventDefault();
  var d = dragItem;
  dragItem = null;
  var ind = e.target.closest('.drop-before, .drop-after, .drop-in');
  clearDragIndicator();

  if(d.kind==='site'){
    var big = bigById(d.big); if(!big) return;
    /* 落到某卡片：同大分类内移动/排序 */
    if(t && t.classList.contains('site-card') && t.getAttribute('data-k')==='site'){
      var targBig = bigById(t.getAttribute('data-big'));
      if(targBig && targBig.id===big.id){
        var tsite = t.getAttribute('data-id');
        var tsub = t.getAttribute('data-sid');
        var pos = ind ? (ind.classList.contains('drop-before')?'before':'after') : 'after';
        var tpos = findSiteByAnyId(big, tsite);
        var beforeId = pos==='before' ? tsite : (tpos && tpos.sub.sites[tpos.idx+1] ? tpos.sub.sites[tpos.idx+1].id : null);
        moveSiteTo(d.id, d.sid, d.big, tsub, beforeId);
      }
      return;
    }
    /* 落到某个子分类区块 / sites 容器 */
    if(t && t.classList.contains('sub-block')){
      var tSub = t.getAttribute('data-sid');
      moveSiteTo(d.id, d.sid, d.big, tSub, null);
      return;
    }
    if(t && t.classList.contains('sites')){
      var tSub2 = t.getAttribute('data-sid');
      moveSiteTo(d.id, d.sid, d.big, tSub2, null);
      return;
    }
    return;
  }

  if(d.kind==='sub'){
    var dBig = bigById(d.big); if(!dBig) return;
    /* 落到子分类区块前/后：移动并排序 */
    if(t && t.classList.contains('sub-block')){
      var targBig2 = bigById(t.getAttribute('data-big'));
      if(!targBig2) return;
      var targetSid = t.getAttribute('data-sid');
      var pos = ind ? (ind.classList.contains('drop-before')?'before':'after') : 'after';
      var holder = findContainer(targBig2, targetSid);
      if(!holder || !holder.parent) return;
      var targetParentId = (holder.parent.id!==targBig2.id) ? holder.parent.id : null;
      var beforeId = null;
      if(pos==='before'){ beforeId = targetSid; }
      else {
        var nxt = holder.parent.children[holder.idx+1];
        beforeId = nxt ? nxt.id : null;
      }
      moveSubTo(d.id, d.big, targBig2.id, targetParentId, beforeId);
      return;
    }
    /* 落到大分类标签：移动到该大分类 */
    if(t && t.classList.contains('bigtab') && t.getAttribute('data-k')==='big'){
      var tBigId = t.getAttribute('data-id');
      if(tBigId !== d.big){
        var srcHolder = findContainer(bigById(d.big), d.id);
        if(srcHolder && srcHolder.parent){
          /* 移除并附加到目标大分类末尾 */
          var node = srcHolder.parent.children[srcHolder.idx];
          srcHolder.parent.children.splice(srcHolder.idx,1);
          var tbig = bigById(tBigId);
          if(!tbig.children) tbig.children=[];
          tbig.children.push(node);
          save(); renderAll();
        }
      }
      return;
    }
    return;
  }

  if(d.kind==='big'){
    if(t && t.classList.contains('bigtab') && t.getAttribute('data-k')==='big'){
      var pos = ind ? (ind.classList.contains('drop-before')?'before':'after') : 'after';
      var beforeBigId = null;
      if(pos==='before'){ beforeBigId = t.getAttribute('data-id'); }
      else {
        var holder = state.bigCategories.findIndex(function(b){return b.id===t.getAttribute('data-id');});
        var nxt = state.bigCategories[holder+1];
        beforeBigId = nxt ? nxt.id : null;
      }
      moveBigTo(d.id, beforeBigId);
      return;
    }
    if(t && t.id==='bigtabs'){
      var last = state.bigCategories[state.bigCategories.length-1];
      moveBigTo(d.id, last && last.id!==d.id ? null : null);
      return;
    }
    return;
  }
});

var ENGINES = [
  {name:'百度', host:'baidu.com',   url:'https://www.baidu.com/s?wd='},
  {name:'搜狗', host:'sogou.com',   url:'https://www.sogou.com/web?query='},
  {name:'必应', host:'bing.com',    url:'https://www.bing.com/search?q='},
  {name:'翻译', host:'fanyi.baidu.com', url:'https://fanyi.baidu.com/#auto/zh/'},
  {name:'微信', host:'weixin.sogou.com', url:'https://weixin.sogou.com/weixin?type=2&query='},
  {name:'抖音', host:'douyin.com',  url:'https://www.douyin.com/search/'}
];
var curEngine = 0;
function renderWebSearch(){
  var box = $('#websearch'); if(!box) return;
  var h = '<div class="ws-card"><div class="ws-engines">';
  ENGINES.forEach(function(en, i){
    h += '<button class="ws-engine' + (i===curEngine?' active':'') + '" data-i="' + i + '">';
    h += '<img src="' + favCandidates(en.host)[0] + '" alt="" data-fc="' + en.host + '" data-fi="0" onerror="favErr(this)">';
    h += en.name + '</button>';
  });
  h += '</div><div class="ws-row">';
  h += '<input id="wsInput" type="text" placeholder="输入关键词，使用当前引擎搜索…" autocomplete="off">';
  h += '<button class="ws-go" id="wsGo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>搜索</button>';
  h += '</div></div>';
  box.innerHTML = h;
  var chips = $$('.ws-engine', box);
  chips.forEach(function(b){
    b.addEventListener('click', function(){
      curEngine = parseInt(b.getAttribute('data-i'),10);
      chips.forEach(function(x){ x.classList.toggle('active', x===b); });
    });
  });
  function doWsSearch(){
    var q = $('#wsInput').value.trim();
    if(!q){ toast('请输入搜索关键词','error'); return; }
    window.open(ENGINES[curEngine].url + encodeURIComponent(q), '_blank');
  }
  $('#wsGo').addEventListener('click', doWsSearch);
  $('#wsInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doWsSearch(); } });
}

/* ====== 飞书表格双向同步（需本机运行 sync_server.py） ====== */
var SYNC_URL = 'http://127.0.0.1:8787';
var syncTimer = null;
var syncLast = '';
function syncPushDebounce(){
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToFeishu, 800);
}
function xhrJson(method, path, body){
  return new Promise(function(resolve){
    var x = new XMLHttpRequest();
    x.open(method, SYNC_URL + path, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){
      try{ resolve({ok: x.status>=200 && x.status<300, data: JSON.parse(x.responseText||'{}'), status:x.status}); }
      catch(e){ resolve({ok:false, data:{}, status:x.status}); }
    };
    x.onerror = function(){ resolve({ok:false, data:{}, status:0}); };
    try{ x.send(body? JSON.stringify(body): null); }catch(e){ resolve({ok:false, data:{}, status:0}); }
  });
}
function pushToFeishu(){
  if(!state.bigCategories.length) return;
  xhrJson('POST', '/api/push', {bigCategories:state.bigCategories}).then(function(r){
    if(r.ok && r.data.ok){ setSyncStatus('已同步到飞书', 'ok'); }
    else{ setSyncStatus('同步失败：请确认本机同步服务已启动', 'err'); }
  });
}
function pullFromFeishu(){
  xhrJson('GET', '/api/pull', null).then(function(r){
    if(r.ok && r.data.ok && r.data.bigCategories && r.data.bigCategories.length){
      syncLast = JSON.stringify(r.data.bigCategories);
      if(syncLast !== JSON.stringify(state.bigCategories)){
        state.bigCategories = r.data.bigCategories;
        if(!state.activeBigId || !state.bigCategories.find(function(b){return b.id===state.activeBigId;})){
          state.activeBigId = state.bigCategories[0].id;
        }
        state.path = [];
        renderAll();
        setSyncStatus('已从飞书拉取更新', 'ok');
      }
    }
  });
}
function setSyncStatus(text, type){
  var el = $('#syncStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'sync-status ' + (type||'');
  el.style.display = 'inline-flex';
  clearTimeout(el.__t);
  el.__t = setTimeout(function(){ el.style.display = 'none'; }, 4000);
}
/* 启动时拉一次飞书数据（若本机同步服务在运行） */
setTimeout(pullFromFeishu, 1200);
